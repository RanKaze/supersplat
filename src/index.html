<!DOCTYPE html>
<html>
    <head>
<script>
/* Kolid Desktop(跨源 iframe 页签):window.close() 是 no-op,转发给宿主壳页关页签;
   宿主点页签 × 时发来 {__kolid:'pageClose'},补一次 beforeunload 让本页的通知照常发出。
   独立在普通浏览器里打开时(window.parent===window)整段不生效。 */
(function () {
  if (window.parent === window) return;
  window.close = function () {
    try { window.top.postMessage({ __kolid: 'closeTab' }, '*'); } catch (e) {}
  };
  window.addEventListener('message', function (e) {
    if (e.data && e.data.__kolid === 'pageClose') {
      try { window.dispatchEvent(new Event('beforeunload')); } catch (err) {}
    }
  });
})();
</script>

        <title>SuperSplat</title>
        <meta charset="utf-8" />
        <base href="__BASE_HREF__">
        <link rel="manifest" href="./manifest.json">
        <link rel="stylesheet" href="./index.css">
        <link rel="shortcut icon" href="#">
        <meta name="description" content="SuperSplat is an advanced browser-based editor for manipulating and optimizing 3D Gaussian Splats. It is open source and engine agnostic." />
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />

        <!-- Service worker -->
        <script>
            const sw = navigator.serviceWorker;
            if (sw) {
                sw.register('./sw.js')
                    .then(reg => console.log('service worker registered', reg))
                    .catch(err => console.log('failed to register service worker', err));
            }
        </script>
    </head>

    <body>
        <script type="module" src="./index.js"></script>
    </body>
</html>
